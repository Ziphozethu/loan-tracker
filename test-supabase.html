<!DOCTYPE html>
<html>
<head>
    <title>Supabase Connection Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        pre { background: white; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Supabase Connection Diagnostic</h1>
    <div id="results"></div>

    <script>
        const SUPABASE_URL = "https://fdsqwpgwhcpceiptamfy.supabase.co";
        const SUPABASE_KEY = "sb_publishable_umuFeOvqGzD1PJCFAWLjNQ_NKK78-Aj";
        const resultsDiv = document.getElementById("results");

        async function test(name, fn) {
            try {
                await fn();
                addResult(name, "✅ Success", "success");
            } catch (err) {
                addResult(name, `❌ ${err.message}`, "error");
            }
        }

        function addResult(title, message, className) {
            const div = document.createElement("div");
            div.className = `result ${className}`;
            div.innerHTML = `<strong>${title}</strong><pre>${message}</pre>`;
            resultsDiv.appendChild(div);
        }

        (async () => {
            addResult("Configuration", `URL: ${SUPABASE_URL}<br>Key: ${SUPABASE_KEY.slice(0, 20)}...`, "info");

            // Test 1: Basic connectivity
            await test("Connection Test", async () => {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/`, {
                    headers: { apikey: SUPABASE_KEY }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
            });

            // Test 2: Fetch loans table
            await test("Fetch Loans", async () => {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/loans?limit=1`, {
                    headers: {
                        apikey: SUPABASE_KEY,
                        Authorization: `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(`HTTP ${res.status}: ${err}`);
                }
                const data = await res.json();
                addResult("Loans Data Sample", JSON.stringify(data, null, 2), "success");
            });

            // Test 3: Fetch liabilities table
            await test("Fetch Liabilities", async () => {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/liabilities?limit=1`, {
                    headers: {
                        apikey: SUPABASE_KEY,
                        Authorization: `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(`HTTP ${res.status}: ${err}`);
                }
                const data = await res.json();
                addResult("Liabilities Data Sample", JSON.stringify(data, null, 2), "success");
            });

            // Test 4: Check RLS policies
            addResult("Next Steps", "1. If 'Fetch Loans' failed with 'permission denied', you need to check Supabase RLS policies<br>2. If 'HTTP 404', the tables don't exist<br>3. If connection test failed, the Supabase project may be down", "info");
        })();
    </script>
</body>
</html>
